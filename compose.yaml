services:
  postgres-dev:
    image: postgres:17
    environment:
      POSTGRES_DB: shuamo_dev
      POSTGRES_USER: shuamo_local
      POSTGRES_PASSWORD: shuamo_local_only
    ports:
      - "5432:5432"
    volumes:
      - shuamo_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shuamo_local -d shuamo_dev"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: shuamo_test
      POSTGRES_USER: shuamo_test
      POSTGRES_PASSWORD: shuamo_test_local_only
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shuamo_test -d shuamo_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: shuamo_local
      MINIO_ROOT_PASSWORD: shuamo_local_only
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - shuamo_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["setup"]
    environment:
      MINIO_ROOT_USER: shuamo_local
      MINIO_ROOT_PASSWORD: shuamo_local_only
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/shuamo-product-images
        mc anonymous set download local/shuamo-product-images
        mc admin user add local shuamo_app_key shuamo_app_secret_local_only || true
        mc admin policy attach local readwrite --user shuamo_app_key

volumes:
  shuamo_dev_data:
  shuamo_minio_data:
